# Shared by tests and image publishing. Include workspace/tooling changes in every code check.
# Runtime tests read assets; Docker also copies examples and media into the image.
runtime:
  - 'server/**'
  - 'web/**'
  - 'i18n/**'
  - 'assets/**'
  - 'media/**'
  - 'examples/**'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - 'mise.toml'
  - '.github/filters.yml'
  - '.github/workflows/tests.yml'
  - '.github/workflows/ci.yml'
container:
  - '.dockerignore'
  - 'docker/**'
translations:
  - 'server/src/**'
  - 'web/src/**'
  - 'i18n/**'
  - 'scripts/*i18n*'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - 'mise.toml'
  - '.github/filters.yml'
  - '.github/workflows/tests.yml'
  - '.github/workflows/ci.yml'
lint:
  - 'server/**'
  - 'web/**'
  - 'i18n/**'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - 'mise.toml'
  - '.github/filters.yml'
  - '.github/workflows/tests.yml'
  - '.github/workflows/ci.yml'
