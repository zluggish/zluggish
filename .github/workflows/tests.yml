name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm codegen
      - run: git diff --exit-code -- src/protocol/generated

  cli:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.1'
      - run: pnpm --dir ../server install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  quality:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          working_directory: cli
      - run: mise run install
        working-directory: cli
      - run: mise run lint
        working-directory: cli
      - run: mise run format
        working-directory: cli

  container:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --platform ${{ matrix.platform }} --target server --load -t zluggish:test server
      - run: docker run --rm -i --platform ${{ matrix.platform }} --read-only --tmpfs /tmp --tmpfs /usr/src/app/zwift-offline/storage --entrypoint node zluggish:test --input-type=module < server/scripts/smoke-container.mjs
