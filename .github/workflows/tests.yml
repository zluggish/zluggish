name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PR runs no longer need to occupy test runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runtime: ${{ github.event_name != 'pull_request' || steps.filter.outputs.runtime == 'true' }}
      container: ${{ github.event_name != 'pull_request' || steps.filter.outputs.runtime == 'true' || steps.filter.outputs.container == 'true' }}
      translations: ${{ github.event_name != 'pull_request' || steps.filter.outputs.translations == 'true' }}
      lint: ${{ github.event_name != 'pull_request' || steps.filter.outputs.lint == 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
      # The PR API compares the entire PR (including forks), rather than only its latest push.
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: .github/filters.yml

  server:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: pnpm/action-setup@v6
        with:
          version: '12.18.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:web
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --dir .. build
      - name: Regenerate protocol files
        run: pnpm codegen
      - name: Check generated protocol files are up to date
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- src/protocol/generated)" ]]; then
            git diff -- src/protocol/generated
            git status --short --untracked-files=all -- src/protocol/generated
            echo 'Generated protocol files are out of date. Run pnpm codegen from server/ and commit the results.'
            exit 1
          fi

  translations:
    needs: changes
    if: needs.changes.outputs.translations == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: mise run i18n:check
      - run: mise run i18n:test

  quality:
    needs: changes
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          working_directory: server
      - run: mise run install
        working-directory: server
      - run: mise run lint
        if: needs.changes.outputs.lint == 'true'
        working-directory: server
      - run: mise run format
        working-directory: server

  container:
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - run: docker buildx build --platform ${{ matrix.platform }} -f server/Dockerfile --target server --load -t zluggish:test .
      - run: docker run --rm -i --platform ${{ matrix.platform }} --read-only --tmpfs /tmp --tmpfs /usr/src/app/zluggish/storage --entrypoint node zluggish:test --input-type=module < server/scripts/smoke-container.mjs
      - run: docker run --rm -i --platform ${{ matrix.platform }} --read-only --tmpfs /tmp --entrypoint node zluggish:test --input-type=module < server/scripts/smoke-storage.mjs

  launcher-browser:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: pnpm/action-setup@v6
        with:
          version: '12.18.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser

  # Single required check: matrix jobs skipped by the paths filter never report their expanded
  # names (e.g. "server (ubuntu-26.04)"), so branch protection requires this job instead.
  required:
    if: always()
    needs: [changes, server, translations, quality, container, launcher-browser]
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
