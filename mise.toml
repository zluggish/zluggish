[tools]
python = '3.12'
node = '24'
pnpm = '10'
'npm:prettier' = '3.6.2'
ruff = '0.12.12'

[settings.npm]
package_manager = 'pnpm'

[env]
_.python.venv = { path = '.venv', create = true }

[tasks.install]
description = 'Install Python dependencies'
run = 'python -m pip install -r requirements.txt'

[tasks.test]
description = 'Run the Python test suite'
run = 'python -m unittest discover -s tests -v'

[tasks.lint]
description = 'Check Python for errors'
run = 'ruff check .'

[tasks.format-fix]
description = 'Format supported project files'
run = 'prettier --write .'

[tasks.format]
description = 'Check formatting of supported project files'
run = 'prettier --check .'

[tasks.check]
description = 'Run lint, formatting checks, and tests'
depends = ['lint', 'format', 'test']
